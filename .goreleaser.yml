# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
#
# The release of techne. The grammars of the ten languages are C, so every target builds with
# cgo, and the release runs on a macOS runner:
#
#   - darwin builds with the clang of the runner, which links the macOS SDK.
#   - Linux and Windows build with zig as the C compiler: static musl binaries for Linux, and
#     mingw binaries for Windows. zig contains the C libraries of these targets and no macOS SDK.
version: 2

project_name: techne

before:
  hooks:
    - go vet ./...

builds:
  - id: techne-darwin
    dir: .
    main: ./cmd/techne
    binary: techne
    env:
      - CGO_ENABLED=1
      - CC=clang
    mod_timestamp: '{{ .CommitTimestamp }}'
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags: &ldflags
      - -s -w
      - -X go.dokimi.dev/techne/internal/version.buildVersion={{.Version}}
      - -X go.dokimi.dev/techne/internal/version.buildCommit={{.Commit}}
      - -X go.dokimi.dev/techne/internal/version.buildDate={{.CommitDate}}

  - id: techne
    dir: .
    main: ./cmd/techne
    binary: techne
    env:
      - CGO_ENABLED=1
      # zig writes a cache beside each C source, and the module cache is read-only.
      - ZIG_GLOBAL_CACHE_DIR=/tmp/techne-zig
      - ZIG_LOCAL_CACHE_DIR=/tmp/techne-zig
      - >-
        CC=zig cc -target
        {{- if eq .Arch "amd64" }} x86_64{{ else }} aarch64{{ end }}
        {{- if eq .Os "linux" }}-linux-musl{{ else }}-windows-gnu{{ end }}
    mod_timestamp: '{{ .CommitTimestamp }}'
    goos:
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags: *ldflags
    # UPX packs the Linux binaries and the Windows amd64 binary. Gatekeeper rejects a packed
    # darwin binary after notarisation, and UPX is unstable on windows_arm64.
    hooks:
      post:
        - cmd: sh -c 'case "{{ .Target }}" in linux_*|windows_amd64_*) exec upx --best --lzma "{{ .Path }}" ;; esac'
          output: true

archives:
  - id: default
    formats: ['tar.gz']
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: ['zip']
    files:
      - LICENSE
      - README*

source:
  enabled: true
  name_template: '{{ .ProjectName }}_{{ .Version }}_source'

checksum:
  name_template: checksums.txt
  algorithm: sha256

signs:
  - cmd: cosign
    signature: '${artifact}.sig'
    certificate: '${artifact}.pem'
    args:
      - sign-blob
      - '--output-signature=${signature}'
      - '--output-certificate=${certificate}'
      - '${artifact}'
      - '--yes'
    artifacts: checksum
    output: true

changelog:
  sort: asc
  use: github
  groups:
    - title: New features
      regexp: '^feat'
      order: 0
    - title: Performance
      regexp: '^perf'
      order: 1
    - title: Bug fixes
      regexp: '^fix'
      order: 2
    - title: Test rigor
      regexp: '^test'
      order: 3
    - title: Refactors
      regexp: '^refactor'
      order: 4
    - title: Other
      order: 999
  filters:
    exclude:
      - '^docs'
      - '^ci'
      - '^chore'
      - '^build'
      - '^style'
      - 'Merge pull request'
      - 'Merge branch'

homebrew_casks:
  - name: techne
    binaries:
      - techne
    homepage: 'https://github.com/thesm-os/techne'
    description: 'Serves code intelligence and refactoring of ten languages to AI agents over MCP'
    # Homebrew keeps com.apple.quarantine on a binary of a cask, and Gatekeeper then stops the
    # unsigned binary at its first run on Apple Silicon. The hook removes the attribute.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/techne"]
          end
    # The tap is github.com/thesm-os/homebrew-tap. The release workflow passes a token with
    # contents:write on it as HOMEBREW_TAP_TOKEN.
    repository:
      owner: thesm-os
      name: homebrew-tap
      branch: main
      token: '{{ .Env.HOMEBREW_TAP_TOKEN }}'
    commit_author:
      name: github-actions[bot]
      email: 41898282+github-actions[bot]@users.noreply.github.com
    commit_msg_template: 'brew: bump {{ .ProjectName }} to {{ .Tag }}'
    # A prerelease, such as v1.0.0-rc1, does not update the cask.
    skip_upload: auto

release:
  draft: false
  prerelease: auto
  footer: |
    **Full changelog:** {{ .ReleaseURL }}

report_sizes: true
