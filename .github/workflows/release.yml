# The release of a tag. It runs on macOS, because the darwin builds of .goreleaser.yml link the
# macOS SDK through the clang of the runner. zig compiles the C of the Linux and Windows builds.
name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  id-token: write       # cosign keyless signing and the OIDC token of the attestation
  attestations: write   # actions/attest-build-provenance writes the SLSA attestation

jobs:
  goreleaser:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: sigstore/cosign-installer@v3
      - name: Install UPX
        run: brew install upx
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A token with contents:write on the tap, which the homebrew_casks block of
          # .goreleaser.yml uses to update the cask on every tag that is not a prerelease.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      # The SLSA Build L3 provenance attestation. GitHub stores it in its attestation API and not
      # in the release, so it also works for a repository with immutable releases. A user checks
      # a file with `gh attestation verify --owner <owner> <file>`.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          # The archives and the binary of each target, so a user can check the installed binary
          # without the archive.
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/**/techne
            dist/**/techne.exe
