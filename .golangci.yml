# Managed by ergon init, with .ergon/local/.golangci.yml merged in. Change the repository's settings there and run ergon init sync.
#
# The configuration of golangci-lint for every module of the repository. It enables each linter
# that a Go repository of the baseline enables, with the strictest setting that one of them uses.
# A repository adds its own settings in its local file, which merges into this one: maps key by
# key, lists appended. The depguard rules of the repository's module boundaries go there.

version: "2"
run:
  timeout: 5m
  modules-download-mode: readonly
  allow-parallel-runners: true
  tests: true
  relative-path-mode: gomod
output:
  show-stats: true
  sort-order:
    - linter
    - severity
    - file
linters:
  default: none
  enable:
    # Correctness
    - copyloopvar
    - durationcheck
    - errcheck
    - errorlint
    - exhaustive
    - forcetypeassert
    - gosec
    - govet
    - ineffassign
    - makezero
    - nilerr
    - nilnil
    - predeclared
    - reassign
    - staticcheck
    - unconvert
    - unused
    - wastedassign
    # Modernization
    - modernize
    - unparam
    # Performance
    - bodyclose
    - gocritic
    - mirror
    - noctx
    - perfsprint
    - prealloc
    # Architecture and style
    - decorder
    - depguard
    - dupl
    - dupword
    - forbidigo
    - funcorder
    - goconst
    - interfacebloat
    - misspell
    - musttag
    - nolintlint
    - revive
    - sloglint
    - usestdlibvars
    - whitespace
    - wrapcheck
    # Concurrency
    - asasalint
    - containedctx
    - contextcheck
    - errname
    - fatcontext
    - spancheck
    # Test hygiene
    - paralleltest
    - testifylint
    - testpackage
    - thelper
    - tparallel
    - usetesting
  settings:
    asasalint:
      use-builtin-exclusions: true
    copyloopvar:
      check-alias: true
    decorder:
      disable-dec-order-check: true
      disable-init-func-first-check: false
    # depguard allows only the standard library in a module without rules, so this rule denies
    # the packages that the standard library or a successor replaces, and allows everything else.
    # A repository adds the rules of its module boundaries in its local file.
    depguard:
      rules:
        replaced:
          list-mode: lax
          files:
            - $all
          deny:
            - pkg: io/ioutil$
              desc: io/ioutil is deprecated, so use io and os
            - pkg: github.com/pkg/errors
              desc: wrap with fmt.Errorf and %w, and match with errors.Is and errors.As
            - pkg: golang.org/x/exp/slices$
              desc: use slices of the standard library
            - pkg: golang.org/x/exp/maps$
              desc: use maps of the standard library
            - pkg: golang.org/x/net/context$
              desc: use context of the standard library
            - pkg: github.com/golang/protobuf
              desc: github.com/golang/protobuf is deprecated, so use google.golang.org/protobuf
        # core declares the ports and the vocabulary, and imports nothing else of techne. The
        # services that drive the ports are techne-service, and the surface of the agent is
        # techne-tool.
        core:
          files: ["**/techne-core/**"]
          list-mode: strict
          allow:
            - $gostd
            - go.dokimi.dev/assert
            - go.dokimi.dev/techne/core
        # The read path, the write path and the workspace. A service imports core, and not the
        # surface of the agent.
        service:
          files: ["**/techne-service/**"]
          list-mode: strict
          allow:
            - $gostd
            - go.dokimi.dev/assert
            - go.dokimi.dev/techne/core
            - go.dokimi.dev/techne/service
            # LockFileEx, the advisory lock of a file on Windows, which the lock of a workspace
            # takes.
            - golang.org/x/sys/windows
        # The surface of the agent. A tool takes a service through an interface that it
        # declares, so techne-service is absent from this list.
        tool:
          files: ["**/techne-tool/**"]
          list-mode: strict
          allow:
            - $gostd
            - go.dokimi.dev/assert
            - go.dokimi.dev/techne/core
            - go.dokimi.dev/techne/tool
            # The schema of a tool from the types of its handler. The library is a module of its
            # own, so the surface of the agent does not import a transport.
            - github.com/google/jsonschema-go
        lang:
          files: ["**/techne-lang/**"]
          list-mode: strict
          allow:
            - $gostd
            - go.dokimi.dev/assert
            - go.dokimi.dev/techne/core
            - go.dokimi.dev/techne/lang$
            - go.dokimi.dev/techne/lang/treesitter
            - go.dokimi.dev/techne/lang/lsp
            - go.dokimi.dev/techne/lang/engines
            - go.dokimi.dev/techne/lang/conformance
            # The binding of tree-sitter. A grammar belongs to one language, so the module of
            # that language imports it.
            - github.com/tree-sitter/go-tree-sitter
            # The language server protocol, for its union types: a definition is a location, a
            # list of locations or a list of links.
            - go.lsp.dev/protocol
            - go.lsp.dev/jsonrpc2
            - go.lsp.dev/uri
            # The glob patterns of the file watchers that a language server registers, with ** and
            # {a,b}, which path.Match does not take.
            - github.com/bmatcuk/doublestar/v4
        presenter:
          files: ["**/techne-presenter/**"]
          list-mode: strict
          allow:
            - $gostd
            - go.dokimi.dev/assert
            - go.dokimi.dev/techne/core
            - go.dokimi.dev/techne/tool
            - go.dokimi.dev/techne/presenter
            # The MCP SDK. The presenter is the only module that imports it.
            - github.com/modelcontextprotocol/go-sdk
        # The production files of a language module import core and the shared packages of
        # lang, and no other language module. The Go module has a rule of its own, because it
        # imports its own type checker.
        language-module:
          files: ["**/techne-lang-*/**", "!**/techne-lang-go/**", "!$test"]
          list-mode: strict
          allow:
            - $gostd
            - go.dokimi.dev/techne/core
            - go.dokimi.dev/techne/lang$
            - go.dokimi.dev/techne/lang/engines
            - go.dokimi.dev/techne/lang/lsp
            - go.dokimi.dev/techne/lang/treesitter
            - github.com/tree-sitter/go-tree-sitter
            # A grammar of tree-sitter. The grammar of a module is the one that it imports.
            - github.com/tree-sitter/tree-sitter-
        go-module:
          files: ["**/techne-lang-go/**", "!$test"]
          list-mode: strict
          allow:
            - $gostd
            - go.dokimi.dev/techne/core
            - go.dokimi.dev/techne/lang$
            - go.dokimi.dev/techne/lang/engines
            - go.dokimi.dev/techne/lang/lsp
            - go.dokimi.dev/techne/lang/treesitter
            - go.dokimi.dev/techne/lang/go
            - github.com/tree-sitter/go-tree-sitter
            - github.com/tree-sitter/tree-sitter-go
            # The loader of the Go toolchain, which type-checks a module in the process, and the
            # packages of the go/ tree that it returns.
            - golang.org/x/tools/go/packages
            - go/ast
            - go/token
            - go/types
            # The parser and the printer of Go, with which a move reads a file that the load
            # excludes and prints a file that it rewrites.
            - go/format
            - go/parser
            # The build constraints of go/build, with which the checker decides whether a build
            # of another port includes a file that the load excludes, as gopls decides it, and the
            # scanner of Go, with which it finds the excluded files that name a declaration.
            - go/build$
            - go/scanner
            # The import edits of goimports and its printer, with which a move adds, deletes and
            # rewrites the imports of the files that it changes and prints them in the groups of
            # goimports.
            - golang.org/x/tools/go/ast/astutil
            - golang.org/x/tools/imports$
        # The tests of a language module import its own package and the test packages of lang,
        # such as the conformance suite and the scripted server. depguard matches a file against
        # any entry of files, so the globs name the test files of the language modules.
        language-module-tests:
          files: ["**/techne-lang-*/*_test.go", "**/techne-lang-*/**/*_test.go"]
          list-mode: strict
          allow:
            - $gostd
            - go.dokimi.dev/assert
            - go.dokimi.dev/techne/core
            - go.dokimi.dev/techne/lang
            - github.com/tree-sitter/go-tree-sitter
            - github.com/tree-sitter/tree-sitter-
            - golang.org/x/tools/go/packages
            - go/ast
            - go/token
            - go/types
            # The build constraints and the parser of Go, which the tests of the Go module read
            # a declared content with, so the expectation comes from the Go toolchain.
            - go/build/constraint
            - go/parser
    exhaustive:
      default-signifies-exhaustive: true
      check:
        - switch
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^panic$
          msg: return an error instead of a panic
        - pattern: ^(fmt\.(Print|Printf|Println)|print|println)$
          msg: write to an io.Writer that the caller passes, or log through log/slog
    funcorder:
      constructor: true
      struct-method: true
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
      disabled-checks:
        - ifElseChain
    govet:
      enable-all: true
    interfacebloat:
      max: 10
    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: false
    revive:
      severity: error
      confidence: 0.1
      rules:
        - name: blank-imports
        # thelper requires the test first in a helper, so a helper takes its context second.
        - name: context-as-argument
          arguments:
            - allowTypesBefore: "*testing.T"
        - name: early-return
        - name: empty-block
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: exported
        - name: if-return
        - name: indent-error-flow
        - name: modifies-value-receiver
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: redundant-import-alias
        - name: time-naming
        - name: unexported-return
        - name: unnecessary-stmt
        - name: unused-receiver
        - name: var-naming
    # revive checks the package comments and the names, so staticcheck runs every other check.
    staticcheck:
      checks:
        - all
        - -ST1000
        - -ST1003
    # Every test file declares the package x_test, so a test calls only what its package exports.
    # The pattern matches no file name, and an empty pattern would match every one.
    testpackage:
      skip-regexp: "^$"
    usetesting:
      context-background: true
      context-todo: true
      os-setenv: true
      os-mkdir-temp: true
      os-temp-dir: true
    whitespace:
      multi-if: true
      multi-func: false
    # An error that the constructor of an error, a wrap, a join or a context returns already
    # carries its cause, and a walk of a file tree returns the error of the caller's own function,
    # so neither needs a second wrap.
    wrapcheck:
      ignore-sig-regexps:
        - \.New.*Error\(
        - \.(Wrap|Wrapf)\(
        - errors\.(Join|Unwrap)\(
        - \.Err\(
        - context\.Cause\(
        - (fs|filepath)\.WalkDir\(
        - filepath\.Walk\(
      ignore-package-globs:
        - go.dokimi.dev/techne/*
  exclusions:
    generated: lax
    presets:
      - std-error-handling
      - common-false-positives
    paths:
      - (^|/)testdata($|/)
    rules:
      # A table or a fixture of a test exists once per test, so its layout and its size do not
      # matter.
      - path: _test\.go$
        linters: [govet]
        text: "fieldalignment:"
      - path: _test\.go$
        linters: [gocritic]
        text: "(hugeParam|rangeValCopy):"
      # A test states its values inline, because the value is the assertion.
      - path: _test\.go$
        linters: [goconst, gosec]
      # A failed type assertion or an unused parameter in a test fails the test, which is the
      # signal these linters exist for.
      - path: _test\.go$
        linters: [forcetypeassert, unparam]
      # A test file puts its fakes and helpers below the tests that use them, in reading order.
      - path: _test\.go$
        linters: [funcorder]
      # A fake of a test returns a nil value with a nil error on purpose, to prove the guard
      # against a broken value-or-error contract.
      - path: _test\.go$
        linters: [nilnil]
      # A spec mirrors its source file, so the specs of two similar files repeat each other.
      - path: _test\.go$
        linters: [dupl]
      # A test of an allocation ceiling, of an environment variable or of the test binary as a
      # process runs serially, and its name ends in Allocs, Env or Process.
      # testing.AllocsPerRun and t.Setenv panic in a parallel test, and two processes that exit
      # in the same nanosecond write one coverage file.
      - path: _test\.go$
        linters: [paralleltest, tparallel]
        text: 'Test\w*(Allocs|Env|Process)\b'
      # The functions and methods of techne take its values, such as locations, symbols and edits,
      # by value on purpose: the values are immutable, and a copy allocates nothing.
      - linters: [gocritic]
        text: "(hugeParam|rangeValCopy):"
      # A conformance fixture is the source of another language. Ruby closes every nested block
      # with end, so `end end` is the language and not a repeated word. A path is relative to the
      # go.mod of its module.
      - linters: [dupword]
        path: ^doc_test\.go$
        text: Duplicate words \(end\)
formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
    - golines
  # gci groups the standard library apart from every other import. A repository puts its own
  # modules in a group of their own by adding gci's sections in its local file, such as standard,
  # default and the prefix of its module paths.
  settings:
    gofumpt:
      extra:
        group-params: true
    golines:
      max-len: 120
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: false
  fix: false
severity:
  default: error
