# golangci-lint configuration for techne.
#
# Reference: https://golangci-lint.run/usage/configuration/
#
# The set below is a conservative baseline — every linter named
# is a "no false-positive" check or a high-signal modernization
# rule. Extend as the project grows.

version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly
  allow-parallel-runners: true
  tests: true

output:
  show-stats: true
  sort-order:
    - linter
    - severity
    - file

linters:
  default: none
  enable:
    # Architecture
    - depguard
    # Correctness
    - copyloopvar
    - errcheck
    - errorlint
    - govet
    - nilerr
    - staticcheck
    - unused
    - wastedassign
    # Modernization
    - modernize
    - unparam
    # Style
    - dupword
    - gocritic
    - misspell
    - revive
    - usestdlibvars
    # Concurrency
    - asasalint
    - contextcheck
    - errname
    # Test hygiene
    - thelper
    - tparallel
    - usetesting

  settings:
    # depguard enforces the module dependency rules from RFC-0001:
    # core imports nothing else in this repository; lang and presenter
    # import core only; a language module imports core and lang and
    # never a sibling language module; only the root module imports a
    # language module or a presenter.
    #
    # Each rule is `list-mode: strict`, so anything the allow list does
    # not name is denied. Two consequences worth knowing before the
    # first lint failure:
    #
    #   - A language module added later is covered with no edit here. A
    #     deny list would have to name each one and would silently stop
    #     covering whichever was forgotten.
    #   - Every third-party import must be named too. Adding a
    #     dependency is an edit to this file as well as to go.mod.
    #
    # `$gostd` covers the standard library. The `$` suffix asks for an
    # exact match: depguard matches by prefix, so a bare
    # `go.dokimi.dev/techne/lang` would also allow
    # `go.dokimi.dev/techne/lang/go`, which is the rule it exists to
    # enforce. The root module has no rule and may import anything.
    depguard:
      rules:
        # core declares what an engine implements and the vocabulary the
        # ports speak. It consumes none of it: the services that drive
        # the ports are techne-service, and the surface an agent calls is
        # techne-tool. Neither may be imported here, and the list below
        # is what stops one being.
        core:
          files: ["**/techne-core/**"]
          list-mode: strict
          allow:
            - $gostd
            - go.dokimi.dev/assert
            - go.dokimi.dev/techne/core

        # The read path, the write path and the workspace they run over.
        # It imports core and nothing else here: a service reaching for
        # the tool surface would put presentation behind the thing that
        # applies changes.
        service:
          files: ["**/techne-service/**"]
          list-mode: strict
          allow:
            - $gostd
            - go.dokimi.dev/assert
            - go.dokimi.dev/techne/core
            - go.dokimi.dev/techne/service

        # The surface an agent calls. It takes a service through an
        # interface it declares itself, so techne-service is absent from
        # this list on purpose: a tool that could name a service would
        # be tested against one.
        tool:
          files: ["**/techne-tool/**"]
          list-mode: strict
          allow:
            - $gostd
            - go.dokimi.dev/assert
            - go.dokimi.dev/techne/core
            - go.dokimi.dev/techne/tool
            # Schema derivation from the handler's own types. Standalone
            # rather than the MCP SDK's own, so the tool surface carries
            # no transport and a second transport needs no second schema.
            - github.com/google/jsonschema-go

        lang:
          files: ["**/techne-lang/**"]
          list-mode: strict
          allow:
            - $gostd
            - go.dokimi.dev/assert
            - go.dokimi.dev/techne/core
            - go.dokimi.dev/techne/lang$
            - go.dokimi.dev/techne/lang/treesitter
            - go.dokimi.dev/techne/lang/lsp
            - go.dokimi.dev/techne/lang/engines
            - go.dokimi.dev/techne/lang/conformance
            # The tree-sitter binding. Grammars are not allowed here:
            # a grammar belongs to one language, so it lives in that
            # language's module.
            - github.com/tree-sitter/go-tree-sitter
            # The language server protocol. Taken as a dependency for
            # the union types: a definition is a location, a list of
            # locations or a list of links, and decoding the wrong arm
            # by hand reports nothing found rather than failing.
            - go.lsp.dev/protocol
            - go.lsp.dev/jsonrpc2
            - go.lsp.dev/uri

        presenter:
          files: ["**/techne-presenter/**"]
          list-mode: strict
          allow:
            - $gostd
            - go.dokimi.dev/assert
            - go.dokimi.dev/techne/core
            - go.dokimi.dev/techne/tool
            - go.dokimi.dev/techne/presenter
            # The transport itself. This is the only module allowed it,
            # which is the reason presenter is a module rather than a
            # package beside the tool surface.
            - github.com/modelcontextprotocol/go-sdk

        language-module:
          files: ["**/techne-lang-*/**"]
          list-mode: strict
          allow:
            - $gostd
            - go.dokimi.dev/assert
            - go.dokimi.dev/techne/core
            - go.dokimi.dev/techne/lang
            - github.com/tree-sitter/go-tree-sitter
            # A grammar belongs to exactly one language module. The
            # prefix admits every tree-sitter grammar rather than naming
            # each: which one a module may use is settled by which one it
            # imports, and no module can import another's.
            - github.com/tree-sitter/tree-sitter-

    gocritic:
      enabled-tags: [diagnostic]
      disabled-checks:
        - ifElseChain

    revive:
      severity: warning
      rules:
        - name: context-as-argument
        - name: var-naming
        - name: package-comments
        - name: receiver-naming
        - name: error-return
        - name: error-naming
        - name: error-strings
        - name: errorf
        - name: if-return
        - name: indent-error-flow
        - name: early-return
        - name: unused-receiver

    govet:
      enable-all: true

    # A test that builds its own background context leaks it past the
    # test. t.Context() is cancelled when the test finishes, so a
    # forgotten goroutine dies with the test rather than outliving it.
    usetesting:
      context-background: true
      context-todo: true

  exclusions:
    generated: lax
    presets:
      - std-error-handling
      - common-false-positives
    rules:
      # fieldalignment is noise outside hot-path structs.
      - linters: [govet]
        text: "fieldalignment:"
      # A conformance fixture is another language's source rather than
      # prose. Ruby closes every nested block with `end`, so `end end` is
      # the language and not a typo.
      - linters: [dupword]
        path: techne-lang-.*/doc_test\.go

formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
    - golines

  settings:
    golines:
      max-len: 120
    gofumpt:
      extra:
        group-params: true

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  fix: false

severity:
  default: error
